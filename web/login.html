<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SilverFox C² — 登录</title>
<style>
:root{
  --bg:#000;
  --bg2:#0a0a0a;
  --bg3:#0f0f0f;
  --border:#1a1a1a;
  --accent:#06b6d4;
  --accent-hover:#22d3ee;
  --accent-dim:#0e3a44;
  --red:#ef4444;
  --white:#e5e7eb;
  --gray:#6b7280;
  --gray-light:#9ca3af;
  --gray-dark:#374151;
  --font:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:var(--font);font-size:14px;
  background:#000;color:var(--white);
  height:100vh;display:flex;align-items:center;justify-content:center;
}
.login-card{
  width:380px;background:#080808;border:1px solid var(--border);
  border-radius:10px;padding:36px 32px;position:relative;
}
.login-card::before{
  content:'';position:absolute;top:-1px;left:24px;right:24px;
  height:1px;background:linear-gradient(90deg,transparent,var(--accent-dim),transparent);
}
.lc-header{text-align:center;margin-bottom:28px}
.lc-logo{
  width:48px;height:48px;margin:0 auto 12px;
  background:linear-gradient(135deg,var(--accent),var(--accent-dim));
  border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-size:20px;font-weight:700;color:#000;letter-spacing:1px;
}
.lc-title{font-size:18px;font-weight:700;letter-spacing:3px;color:var(--accent)}
.lc-ver{font-size:11px;color:var(--gray);margin-top:4px}
.lc-tagline{font-size:11px;color:var(--gray);margin-top:8px;line-height:1.7}

.form-group{margin-bottom:14px}
.form-group label{display:block;font-size:11px;color:var(--gray-light);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
.form-group input{
  width:100%;padding:10px 14px;background:#000;
  border:1px solid var(--border);border-radius:5px;
  color:var(--white);font-size:13px;font-family:inherit;outline:none;transition:all .15s;
}
.form-group input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(6,182,212,.08)}
.form-group input::placeholder{color:var(--gray-dark)}

.form-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;font-size:11px}
.form-row label{cursor:pointer;display:flex;align-items:center;gap:5px;color:var(--gray);font-size:11px}
.form-row input[type=checkbox]{accent-color:var(--accent);width:13px;height:13px}
.form-row a{color:var(--gray);text-decoration:none;font-size:11px}
.form-row a:hover{color:var(--accent)}

.btn-login{
  width:100%;padding:12px;background:var(--accent);color:#000;
  border:none;border-radius:5px;font-size:14px;font-weight:700;font-family:inherit;
  cursor:pointer;letter-spacing:2px;transition:all .15s;
}
.btn-login:hover{background:var(--accent-hover);box-shadow:0 0 24px rgba(6,182,212,.2)}
.btn-login:disabled{background:var(--gray-dark);color:var(--gray);cursor:not-allowed;box-shadow:none}

.err{display:none;color:var(--red);font-size:12px;text-align:center;margin-top:10px}
.err.show{display:block}

.lc-footer{text-align:center;margin-top:24px;font-size:10px;color:var(--gray-dark)}
</style>
</head>
<body>

<div class="login-card">
  <div class="lc-header">
    <div class="lc-logo">SF</div>
    <div class="lc-title">SilverFox C²</div>
    <div class="lc-ver">v7.2-web — BUILD 20269713</div>
    <div class="lc-tagline">多协议 跨平台 插件化<br>新一代远程管理平台</div>
  </div>

  <div class="form-group">
    <label>登录到控制台</label>
    <input type="text" id="uname" placeholder="用户名" autocomplete="off">
  </div>
  <div class="form-group">
    <input type="password" id="pass" placeholder="密码" onkeydown="if(event.key==='Enter')doLogin()">
  </div>
  <div class="form-row">
    <label><input type="checkbox" id="remember"> 记住账号</label>
    <a href="javascript:void(0)">忘记密码？</a>
  </div>
  <button class="btn-login" onclick="doLogin()" id="btn">登录</button>
  <div class="err" id="err"></div>
  <div class="lc-footer">Copyright © 2026 SilverFox C²</div>
</div>

<script>
function showErr(m){const e=document.getElementById('err');e.textContent=m;e.classList.add('show')}
async function doLogin(){
  const uname=document.getElementById('uname').value.trim();
  const p=document.getElementById('pass').value.trim();
  if(!uname){showErr('请输入用户名');return}
  if(!p){showErr('请输入密码');return}
  const btn=document.getElementById('btn');btn.disabled=true;btn.textContent='登录中...';
  try{
    const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:uname,password:p})});
    const d=await r.json();
    if(r.ok){
      if(d.token)localStorage.setItem('sf_token',d.token);
      if(document.getElementById('remember').checked){localStorage.setItem('sf_user',uname);localStorage.setItem('sf_pass',p)}
      else{localStorage.removeItem('sf_user');localStorage.removeItem('sf_pass')}
      location.href='/';
    }else{showErr(d.error||'登录失败')}
  }catch(e){showErr('网络错误')}
  btn.disabled=false;btn.textContent='登录';
}
const savedU=localStorage.getItem('sf_user'),savedP=localStorage.getItem('sf_pass');
if(savedU){document.getElementById('uname').value=savedU;document.getElementById('remember').checked=true}
if(savedP){document.getElementById('pass').value=savedP;document.getElementById('remember').checked=true}
</script>
</body>
</html>
